name: release
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      latest_commit: ${{ steps.git_remote.outputs.latest_commit }}
    env:
      CI: "true"
    steps:
      - name: ENG-5167 CA trust fix (remove emSign ECC Root CA - G3)
        shell: bash
        run: |
          set +e -uo pipefail
          B=/etc/ssl/certs/ca-certificates.crt
          G3=86a1ecba089c4a8d3bbe2734c612ba341d813e043cf9e8a862cd5c57a36bbe6b
          X1=96bcec06264976f37460779acf28c5a7cfe8a3c0aae11a8ffcee05c0bddf08c6
          fps() { awk '/-----BEGIN CERTIFICATE-----/{c="openssl x509 -noout -fingerprint -sha256"} c{print | c} /-----END CERTIFICATE-----/{close(c); c=""}' "$B" | sed 's/^.*=//; s/://g' | tr 'A-F' 'a-f'; }
          if [ "$(fps | grep -c -x "$G3")" != 0 ]; then
            echo "ENG5167 G3 present: upgrading ca-certificates"
            sudo apt-get update -qq && sudo apt-get install -y -qq --only-upgrade ca-certificates
          fi
          dpkg-query -W ca-certificates
          FP=$(fps)
          N=$(printf '%s\n' "$FP" | grep -c .)
          PEM=$(grep -c 'BEGIN CERTIFICATE' "$B")
          G3N=$(printf '%s\n' "$FP" | grep -c -x "$G3")
          X1N=$(printf '%s\n' "$FP" | grep -c -x "$X1")
          echo "ENG5167 certs=${N} pem_blocks=${PEM} g3_sha256_count=${G3N} isrg_x1_sha256_count=${X1N}"
          if [ "$G3N" = 0 ] && [ "$X1N" -ge 1 ] && [ "$N" = "$PEM" ]; then echo "ENG5167 MET"; else echo "ENG5167 NOT-MET"; exit 1; fi
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set git identity
        run: |-
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Install dependencies
        run: npm ci
      - name: release
        run: npx projen release
      - name: Check for new commits
        id: git_remote
        run: echo "latest_commit=$(git ls-remote origin -h ${{ github.ref }} | cut -f1)" >> $GITHUB_OUTPUT
      - name: Backup artifact permissions
        if: ${{ steps.git_remote.outputs.latest_commit == github.sha }}
        run: cd dist && getfacl -R . > permissions-backup.acl
        continue-on-error: true
      - name: Upload artifact
        if: ${{ steps.git_remote.outputs.latest_commit == github.sha }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifact
          path: dist
          include-hidden-files: true
